name: Deploy React Portfolio to GitHub Pages

on:
  push:
    branches:
      - portfolio   # your actual branch name

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.16'   # React recommended version, works for most setups


      - name: Git branch
        run: git branch --show-current
  
      - name: List dir
        run: ls -al
      

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build      # Creates the build/ folder

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build        # Build output folder
          branch: gh-pages     # Deployment branch (auto-created)
          clean: true
          token: ${{ secrets.GITHUB_TOKEN }}
